name: Platform CI
on:
  push:
  pull_request:
  schedule:
    - cron: "47 6 * * 1"
permissions:
  contents: read
concurrency:
  group: platform-ci-${{ github.event_name }}-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  validate:
    name: Workflow validation
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: ruby -e 'require "yaml"; Dir.glob(".github/workflows/*.yml").each { |path| YAML.load_file(path) }'
      - run: python3 scripts/test_security_policy.py
      - run: python3 -m venv "$RUNNER_TEMP/telemetry-env"
      - run: '"$RUNNER_TEMP/telemetry-env/bin/python" -m pip install -r telemetry/requirements.txt'
      - run: '"$RUNNER_TEMP/telemetry-env/bin/python" -m unittest discover -s tests -v'
  terraform:
    name: Static hosting offline checks (${{ matrix.root }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        root: [terraform/bootstrap, terraform/modules/static_site, terraform/modules/hosting_environment, terraform/environments/development, terraform/environments/production]
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.17.1
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Initialize caller-provider validation fixture
        if: matrix.root == 'terraform/modules/hosting_environment'
        run: terraform -chdir=tests/validation init -backend=false -input=false -lockfile=readonly
      - name: Validate configured provider bindings
        env:
          TERRAFORM_ROOT: ${{ matrix.root }}
        run: |
          if test "$TERRAFORM_ROOT" = terraform/modules/hosting_environment; then
            terraform -chdir=tests/validation validate
          else
            terraform validate
          fi
      - run: terraform test -no-color
  security:
    uses: ./.github/workflows/security-checks.yml
    permissions:
      contents: read
      security-events: write
      actions: read
  dashboard:
    name: Seeded Grafana dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -m venv "$RUNNER_TEMP/dashboard-env"
      - run: python3 scripts/test_alert_rules.py
      - run: '"$RUNNER_TEMP/dashboard-env/bin/python" -m pip install -r grafana/runtime-requirements.txt'
      - run: '"$RUNNER_TEMP/dashboard-env/bin/python" -m playwright install --with-deps chromium'
      - run: '"$RUNNER_TEMP/dashboard-env/bin/python" scripts/test_dashboard_runtime.py --output "$RUNNER_TEMP/dashboard-evidence"'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: synthetic-dashboard-evidence
          path: ${{ runner.temp }}/dashboard-evidence
          retention-days: 1
  ci:
    name: CI
    if: always()
    needs: [validate, security, terraform, dashboard]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      VALIDATION: ${{ needs.validate.result }}
      SECURITY: ${{ needs.security.result }}
      TERRAFORM: ${{ needs.terraform.result }}
      DASHBOARD: ${{ needs.dashboard.result }}
    steps:
      - run: |
          test "$VALIDATION" = success
          test "$SECURITY" = success
          test "$TERRAFORM" = success
          test "$DASHBOARD" = success
